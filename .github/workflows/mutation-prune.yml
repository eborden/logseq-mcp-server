name: Mutation prune report

# A full cold mutation run with the bail off, for the prune report (ADR-0026, "Pruning and
# strengthening"; #206, #288). Stryker stops at the first failing test by default, so killedBy names
# one killer and overstates redundancy. --disableBail runs every covering test against every mutant,
# about 2.2 times as long as the weekly run, which is why it runs here and never on a laptop.
#
# By hand only (Actions tab, "Run workflow"): put a full SHA, branch or tag in "ref". The CLI flag
# turns the bail off, so stryker.config.json and the mutated scope are the weekly run's.
#
# It reports and changes nothing. It never restores or saves the incremental cache (a cache from
# this run would hold killedBy lists the PR job doesn't expect), never runs the ratchet and never
# touches mutation-baseline.json. Its artifact is named mutation-prune-<sha>, not mutation-report-<sha>,
# so the PR job's ratchet (ADR-0028), which looks for the weekly workflow's artifact, can't take it
# for a weekly run.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit SHA, branch or tag to run on. Empty means the branch the run is started from.
        type: string
        default: ''

permissions:
  contents: read

jobs:
  prune:
    name: Prune report
    runs-on: ubuntu-latest
    # The weekly cold run takes under its 120 minutes; with the bail off it is about 2.2 times as long.
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Resolve the commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # No incremental file exists in a fresh checkout, so Stryker mutates the whole scope.
      - name: Full cold run with the bail off
        id: stryker
        run: npx stryker run --disableBail

      - name: Prune report
        id: prune
        run: node scripts/mutation-prune-report.ts --report reports/mutation/mutation.json --out reports/mutation/prune-report.json --markdown reports/mutation/prune-report.md

      # The job summary holds at most 1 MiB, so a longer report is left to the artifact.
      - name: Job summary
        if: always() && steps.prune.outcome == 'success'
        env:
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          echo "Commit \`$SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          if [ "$(wc -c < reports/mutation/prune-report.md)" -gt 1000000 ]; then
            echo "The prune report is too long for the job summary. It is prune-report.md in the mutation-prune-$SHA artifact." >> "$GITHUB_STEP_SUMMARY"
          else
            cat reports/mutation/prune-report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-prune-${{ steps.commit.outputs.sha }}
          path: |
            reports/mutation/mutation.json
            reports/mutation/prune-report.json
            reports/mutation/prune-report.md
          if-no-files-found: ignore
          retention-days: 30
