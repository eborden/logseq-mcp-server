name: PyPI

# Uploads the PyPI wheels of a PUBLISHED GitHub Release to PyPI (ADR-0036). It builds nothing: release.yml builds the
# three wheels from the binaries it gated, checksums them in SHA256SUMS, attests them and attaches them to the release,
# and this workflow downloads those exact files, checks them again and uploads them. PyPI and GitHub Releases hold the
# same bytes. The release has to be public first, so this runs after the post-publish check of ADR-0035 Decision 12.
#
# Manual only, from main: this workflow never runs on push, tag or pull request. The maintainer starts it from the
# Actions tab ("Run workflow", branch main). No session runs it or uploads anything (ADR-0017, ADR-0035, CLAUDE.md).
#
# - dry_run (the default): checks the release, checks the three wheels against SHA256SUMS, verifies each wheel's
#   attestation against this repository, release.yml, the main branch and the release's commit, installs the Linux
#   wheel into a clean virtual environment, and uploads the wheels as workflow artifacts. It uploads nothing to PyPI.
# - dry_run off: the same, then the publish job uploads the wheels to PyPI. That job waits for the `pypi` environment.
#
# BEFORE THE FIRST REAL RUN the maintainer creates the `pypi` environment (repository settings) with themselves as a
# required reviewer and deployment limited to main, and registers the pending trusted publisher on PyPI (ADR-0036
# Decision 9). A job that names an environment that does not exist makes GitHub create an unprotected one, and then a
# real run uploads with no second click. Nothing in this workflow can check that, so it is a prerequisite, not a guard.
#
# The GitHub Release v<version> must be public (not a draft or a pre-release), or the run fails before it downloads. PyPI
# never lets a file name be uploaded twice, so a run also fails if the version is already on PyPI. A bad upload is
# fixed by a new version. The version is the release's: its wheels were built from the four version files at release
# time by release.yml, so this workflow does not read them again (they move on with main).
#
# Permissions: every job reads the repository only, except the last (publish), which alone has id-token: write, for
# PyPI trusted publishing (no API token is stored anywhere). Every third-party action is pinned by commit SHA (the
# version is in the comment). The one third-party action added for this is pypa/gh-action-pypi-publish, PyPA's own,
# which PyPI's trusted-publishing guide names.
on:
  workflow_dispatch:
    inputs:
      version:
        description: The version to publish, x.y.z. The GitHub Release v<version> must be public and carry the wheels.
        type: string
        required: true
      dry_run:
        description: Check only. Untick it to also upload the wheels to PyPI.
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: pypi
  cancel-in-progress: false

jobs:
  # Fails the run before any download when the version is not plain x.y.z, the release is not public, or PyPI already has
  # the version.
  preflight:
    name: Check the version, the release and PyPI
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the version input
        env:
          VERSION: ${{ inputs.version }}
        run: |
          # [[ =~ ]] matches the whole value, so a multi-line input can't pass on one good line
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The version input must be plain x.y.z, with no v prefix and no pre-release part."
            exit 1
          fi

      # The read-only token can't see a draft, so a draft reads as "not found" here, which is the right answer: wheels
      # are uploaded only from a release that is already public.
      - name: Check that the release v<version> is public
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: v${{ inputs.version }}
        run: |
          if ! state="$(gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease --jq '"\(.isDraft) \(.isPrerelease)"')"; then
            echo "::error::There is no public release ${TAG_NAME}. Publish the draft release first (ADR-0035 Decision 12)."
            exit 1
          fi
          if [ "$state" != "false false" ]; then
            echo "::error::The release ${TAG_NAME} is a draft or a pre-release (isDraft isPrerelease: ${state})."
            exit 1
          fi

      - name: Check that PyPI does not have this version yet
        env:
          VERSION: ${{ inputs.version }}
        run: |
          code="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 30 "https://pypi.org/pypi/logseq-mcp-server/${VERSION}/json")"
          case "$code" in
            404) echo "PyPI has no logseq-mcp-server ${VERSION} yet." ;;
            200) echo "::error::PyPI already has logseq-mcp-server ${VERSION}. A file name can never be uploaded twice; cut a new version."; exit 1 ;;
            *) echo "::error::PyPI answered HTTP ${code}, so the version can't be checked."; exit 1 ;;
          esac

  verify:
    name: Download and check the wheels
    needs: preflight
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The wheels, SHA256SUMS, and the Linux binary the Linux wheel has to match. Nothing else is taken from the release.
      - name: Download the wheels from the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: v${{ inputs.version }}
          VERSION: ${{ inputs.version }}
        run: |
          mkdir assets
          gh release download "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --dir assets \
            --pattern '*.whl' --pattern SHA256SUMS --pattern "logseq-mcp-server-${VERSION}-x86_64-unknown-linux-musl"
          ls -l assets
          test "$(find assets -type f | wc -l)" -eq 5

      # SHA256SUMS lists exactly these three wheels, and each file is the listed bytes. The binary the Linux wheel will
      # be compared with is checked against the same file.
      - name: Check the wheels against SHA256SUMS
        env:
          VERSION: ${{ inputs.version }}
        run: |
          cd assets
          wheels="logseq_mcp_server-${VERSION}-py3-none-macosx_11_0_arm64.whl logseq_mcp_server-${VERSION}-py3-none-macosx_10_12_x86_64.whl logseq_mcp_server-${VERSION}-py3-none-manylinux_2_17_x86_64.musllinux_1_2_x86_64.whl"
          binary="logseq-mcp-server-${VERSION}-x86_64-unknown-linux-musl"
          : > wheels.sha256
          for name in $wheels; do
            test -f "$name"
            test "$(grep -c -E -- "^[0-9a-f]{64}  ${name//./\\.}\$" SHA256SUMS)" -eq 1
            grep -E -- "^[0-9a-f]{64}  ${name//./\\.}\$" SHA256SUMS >> wheels.sha256
          done
          test "$(grep -c -E '^[0-9a-f]{64}  logseq_mcp_server-.*\.whl$' SHA256SUMS)" -eq 3
          sha256sum --check wheels.sha256
          grep -E -- "^[0-9a-f]{64}  ${binary//./\\.}\$" SHA256SUMS | sha256sum --check -
          cat wheels.sha256

      # release.yml attested each wheel (ADR-0036). This ties the bytes about to be uploaded to that workflow in this
      # repository, to the main branch, and to the commit the release is at, so a wheel swapped on the release afterwards
      # fails, and so does an older attested wheel renamed for this version.
      - name: Verify the attestation of each wheel
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: v${{ inputs.version }}
        run: |
          commit="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${TAG_NAME}" --jq .sha)"
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          for wheel in assets/*.whl; do
            gh attestation verify "$wheel" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release.yml" \
              --source-ref refs/heads/main \
              --source-digest "$commit" \
              --deny-self-hosted-runners
          done

      # What an install does, on the one wheel this runner can run: the executable lands on PATH with the release's Linux
      # binary, byte for byte. The binary itself was gated on its target by release.yml.
      - name: Install the Linux wheel into a clean environment
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python3 -m venv "${RUNNER_TEMP}/check"
          "${RUNNER_TEMP}/check/bin/python" -m pip install --no-index --no-deps assets/*musllinux_1_2_x86_64.whl
          cmp "${RUNNER_TEMP}/check/bin/logseq-mcp-server" "assets/logseq-mcp-server-${VERSION}-x86_64-unknown-linux-musl"
          test -x "${RUNNER_TEMP}/check/bin/logseq-mcp-server"

      # On a dry run these are the wheels to inspect by hand (pip install, or unzip -l) before the real run.
      - name: Upload the wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels
          path: assets/*.whl
          if-no-files-found: error
          retention-days: 7

      # The publish job checks the wheels it uploads against these hashes, so a change in transit can't reach PyPI.
      - name: Upload the checksums of the wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel-checksums
          path: assets/wheels.sha256
          if-no-files-found: error
          retention-days: 7

  # The only job with a token, and it runs only on a real run. It waits for the `pypi` environment, which has the
  # maintainer as a required reviewer, and PyPI accepts the upload only from this workflow and environment (the trusted
  # publisher the maintainer registers on PyPI). The action also publishes PEP 740 attestations for the files.
  publish:
    name: Upload the wheels to PyPI
    needs: [preflight, verify]
    if: github.ref == 'refs/heads/main' && !inputs.dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/logseq-mcp-server/${{ inputs.version }}/
    permissions:
      # Trusted publishing: PyPI exchanges this run's OIDC identity for a short-lived upload token.
      id-token: write
    steps:
      - name: Download the wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wheels
          path: dist

      - name: Download the checksums of the wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wheel-checksums
          path: checksums

      # The same three files, with the same bytes, that the verify job checked.
      - name: Check the wheels again
        env:
          VERSION: ${{ inputs.version }}
        run: |
          cd dist
          test "$(find . -type f | wc -l)" -eq 3
          test -f "logseq_mcp_server-${VERSION}-py3-none-macosx_11_0_arm64.whl"
          test -f "logseq_mcp_server-${VERSION}-py3-none-macosx_10_12_x86_64.whl"
          test -f "logseq_mcp_server-${VERSION}-py3-none-manylinux_2_17_x86_64.musllinux_1_2_x86_64.whl"
          test "$(wc -l < ../checksums/wheels.sha256)" -eq 3
          sha256sum --check ../checksums/wheels.sha256

      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
