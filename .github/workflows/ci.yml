name: CI

# The Rust server is the only server (ADR-0025, #349, #356), so the Rust job is the main check. Node stays for the
# tooling the Rust server is held to: the parity harness (scripts/parity), the repo's guard tests (tests/guards,
# tests/rust-guards) and the type-check of both. The integration suites (tests/integration) need a LogSeq desktop
# app serving the fixture graph, which CI doesn't have; they run locally (tests/integration/setup.md).
#
# It builds and tests only; it never publishes (ADR-0017 covers npm, and a binary release needs its own ADR first).
on:
  pull_request:
    # labeled and unlabeled: the golden-files job reads the golden-change label, so adding or removing it has to
    # re-run the check.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main, feature/rust-spike]
  # A manual run also builds and checks the release binary (see the steps below)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # engines.node in package.json is the floor of the dev toolchain (vite 7): 22.12 (ADR-0022).
  # Test the oldest major that satisfies it and the newest. These checks need no Rust build.
  tooling:
    name: Type-check and guard tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      # scripts/, the guard tests and the integration suites (which have their own tsconfig). It only type-checks
      # the integration tests. Running them still needs LogSeq.
      - name: Type-check
        run: npm run typecheck

      # The repo's rules as tests: the docs format (ADRs and business rules), the issue and PR templates, the
      # privacy checks, the fixture graph, the workflows, the tool-list guardrails, the per-worktree instance.
      # tests/rust-guards needs the Rust binary and runs in the job below.
      - name: Guard tests
        run: npx vitest run tests/guards

  # The golden files, scripts/parity/expected, are the tool contract (BR-0004, ADR-0031): the parity step holds the
  # Rust server to them, so a change to one is a change to what the tools promise. A pull request that changes any of
  # them fails here unless it carries the `golden-change` label, which goes on only after the maintainer's explicit OK,
  # recorded on the PR (CLAUDE.md, "Verification before merge"). `--record-from-rust` writes a file only when a result
  # changed in meaning, so a cosmetic re-record doesn't trip this.
  #
  # The labels come in through env:, never into the script text. The base is the first parent of the merge commit that
  # was checked out, so it is the base tip this HEAD was built on even when the base moved after the event, and a
  # labeled or unlabeled re-run doesn't count the base's own changes as the PR's.
  golden-files:
    name: Golden files
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check the golden files
        env:
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          base="$(git rev-parse HEAD^1)"
          changed="$(git diff --name-only "$base" HEAD -- scripts/parity/expected)"
          if [ -z "$changed" ]; then
            echo "No golden file changed."
            exit 0
          fi
          if printf '%s' "$PR_LABELS" | jq -e 'index("golden-change")' > /dev/null; then
            echo "The golden-change label is on this PR; the maintainer's recorded OK covers these changes:"
            printf '%s\n' "$changed"
            exit 0
          fi
          files="$(printf '%s' "$changed" | tr '\n' ' ')"
          echo "::error::This PR changes the golden files, which are the tool contract: ${files}"
          printf '%s\n' "$changed"
          echo "::error::They change only with the maintainer's explicit OK, recorded on the PR. Once it is, the maintainer adds the golden-change label."
          exit 1

  build-and-test:
    name: Cargo build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installs the toolchain rust/rust-toolchain.toml names (rust-src-dir points it there), so
      # CI and local builds use the same compiler, and caches through Swatinem/rust-cache (which
      # the action pins by SHA itself). Its key covers the rustc version, Cargo.lock and the job,
      # and it caches only the dependencies' build output, not this crate's, so a cache never
      # holds a stale build of our code or another toolchain's.
      # Warnings don't fail the build during the spike: build-warnings is v2's switch for that
      # (it defaults to deny), and rustflags is left empty.
      - name: Set up the Rust toolchain and cache
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          rust-src-dir: rust
          cache-workspaces: rust
          rustflags: ""
          build-warnings: warn

      # The action falls back to stable if it misses the toolchain file; fail loudly instead.
      - name: Check the compiler is the pinned one
        run: |
          expected="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          rustc --version | grep -q "^rustc ${expected} " || { rustc --version; echo "expected rustc ${expected}" >&2; exit 1; }

      - name: Build (debug)
        run: cargo build --locked

      - name: Unit tests
        run: cargo test --locked

      # The golden-result harness (#124) holds the binary just built to the results recorded from the TypeScript
      # server before it was retired (scripts/parity/expected): each tool result, prompt and resource byte for byte,
      # the LogSeq calls and `tools/list` by meaning (ADR-0031), the closest names of a missing page by the rules of
      # ADR-0032. It starts its own stub LogSeq on a random local port, so nothing here contacts a LogSeq.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install the harness's dependencies
        working-directory: .
        run: npm ci

      - name: Parity with the recorded results
        working-directory: .
        run: node node_modules/vite-node/vite-node.mjs scripts/parity.ts "$PWD/rust/target/debug/logseq-mcp-server"

      # Passes as committed, fails on every perturbed case and on every wrong list of closest names: a harness that
      # can't fail proves nothing.
      - name: Parity self-check
        working-directory: .
        run: node node_modules/vite-node/vite-node.mjs scripts/parity.ts --self-check "$PWD/rust/target/debug/logseq-mcp-server"

      # The harness's own end-to-end tests and the server-version check, which start the binary just built.
      - name: Guard tests that start the server
        working-directory: .
        run: npx vitest run tests/rust-guards

      # The slowest step (thin LTO, one codegen unit). Only the parity step below uses its output:
      # the startup and footprint measurements (#126) build the release binary locally. It runs on
      # a push to main and by hand. Until then the release profile is checked locally:
      # `cd rust && cargo build --release --locked`.
      - name: Build (release)
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: cargo build --release --locked

      # The library's unit tests with debug_assertions off (#359): the ones that exist only in a release
      # build, such as the one holding that it ignores LOGSEQ_MCP_NOW (`#[cfg(not(debug_assertions))]` in
      # rust/src/env.rs), and the date logic as the shipped profile compiles it. Nothing runs these in a pull
      # request, so they run with the release build. `--lib` skips the integration tests, which spawn the
      # binary and are covered by the debug run and the parity step. Turning LTO off and using 16 codegen
      # units keeps this to a few minutes: the full release profile (thin LTO, one codegen unit) is what makes
      # the build above slow, and neither setting changes what debug_assertions does. It rebuilds the
      # dependencies once, since the profile differs from the one the release build used.
      - name: Unit tests (release)
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        env:
          CARGO_PROFILE_RELEASE_LTO: 'off'
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
        run: cargo test --release --locked --lib

      # The same harness against the release binary (#359): the debug build above proves the logic,
      # this proves the optimised build (thin LTO, one codegen unit, stripped) answers the same. It
      # needs the release build, so it runs under the same condition. A release build ignores
      # LOGSEQ_MCP_NOW (rust/src/env.rs), so --real-clock leaves out the cases that read today's date
      # (scripts/parity/clock-cases.ts); the debug run above still holds the server to every one.
      - name: Parity with the recorded results (release binary)
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        working-directory: .
        run: node node_modules/vite-node/vite-node.mjs scripts/parity.ts --real-clock "$PWD/rust/target/release/logseq-mcp-server"
