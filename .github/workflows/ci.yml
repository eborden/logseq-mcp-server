name: CI

# The Rust server is the only server (ADR-0025, #349, #356), so the Rust job is the main check. Node stays for the
# tooling around it: the repo's guard tests (tests/guards, tests/rust-guards) and the type-check of both. The parity
# cases and the recorder that writes their results are Rust (rust/tests/parity*.rs, #375, #379), so they run in cargo
# test. The integration suites (tests/integration) need a LogSeq desktop app serving the fixture graph, which CI doesn't
# have; they run locally (tests/integration/setup.md).
#
# It builds and tests only; it never publishes (ADR-0017 covers npm, and a binary release needs its own ADR first).
on:
  pull_request:
    # labeled and unlabeled: the golden-files job reads the golden-change label, so adding or removing it has to
    # re-run the check.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main, feature/rust-spike]
  # A manual run also builds and checks the release binary (see the steps below)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # engines.node in package.json is the floor of the dev toolchain (vite 7): 22.12 (ADR-0022).
  # Test the oldest major that satisfies it and the newest. These checks need no Rust build.
  tooling:
    name: Type-check and guard tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      # scripts/, the guard tests and the integration suites (which have their own tsconfig). It only type-checks
      # the integration tests. Running them still needs LogSeq.
      - name: Type-check
        run: npm run typecheck

      # The repo's rules as tests: the docs format (ADRs and business rules), the issue and PR templates, the
      # privacy checks, the fixture graph, the workflows, the tool-list guardrails, the per-worktree instance.
      # tests/rust-guards needs the Rust binary and runs in the job below.
      - name: Guard tests
        run: npx vitest run tests/guards

  # Shell glue is linted (#381): ShellCheck on every tracked *.sh, and actionlint on the workflows, which runs
  # ShellCheck on each run: block too. Any finding fails the job. ShellCheck is the runner's own (its version is
  # printed). actionlint is a release binary, pinned by version and by the SHA-256 of the tarball (from the
  # release's actionlint_<version>_checksums.txt); to bump it, change both and read that file.
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ACTIONLINT_VERSION: '1.7.12'
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ShellCheck the shell scripts
        run: |
          shellcheck --version
          git ls-files -z '*.sh' | xargs -0 --no-run-if-empty shellcheck

      - name: Install actionlint (pinned by checksum)
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location --output "${RUNNER_TEMP}/${archive}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check -
          tar --extract --gzip --file "${RUNNER_TEMP}/${archive}" --directory "${RUNNER_TEMP}" actionlint

      - name: Lint the workflows and their run blocks
        run: '"${RUNNER_TEMP}/actionlint" -color'

  # The golden results are the tool contract (BR-0004, ADR-0034): the `expected` result of each case in
  # rust/tests/data/parity/<group>.json, and the recorded tools/list, rust/tests/data/parity/tool-list.json. The parity
  # test (cargo test, rust/tests/parity.rs) holds the Rust server to them, so a change to one is a change to what the
  # tools promise. A pull request that changes any of them fails here unless it carries the `golden-change` label, which
  # goes on only after the maintainer's explicit OK, recorded on the PR (CLAUDE.md, "Verification before merge"). A group
  # file holds the cases too. A golden answers a request, so the request counts with it: each case's name, `tool`,
  # `arguments`, resource or prompt request, and `expected`, key order and layout aside. A case's stub answers and expected
  # calls (`steps`) don't: re-recording a call is not a change to the contract (ADR-0034 Decision 5). The recorder (`PARITY_RECORD=1`, rust/tests/parity_record.rs) writes a result only when
  # it changed in meaning, so a re-record that changes nothing doesn't trip this, and neither does moving a file without
  # changing a result. The clock list (clock-cases.json) is not a golden.
  #
  # The labels come in through env:, never into the script text. The base is the first parent of the merge commit that
  # was checked out, so it is the base tip this HEAD was built on even when the base moved after the event, and a
  # labeled or unlabeled re-run doesn't count the base's own changes as the PR's.
  golden-files:
    name: Golden files
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check the golden files
        env:
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          base="$(git rev-parse HEAD^1)"
          dir=rust/tests/data/parity
          # A group file's goldens: each case's name, the request it answers and its result, a line of JSON each (none for a file that is not
          # there or not JSON, which then reads as every golden in it gone).
          file_cases() {
            git show "$1:$2" 2> /dev/null | jq -c '.cases[] | {name, tool, arguments, readResource, getPrompt, listPrompts, listResources, listResourceTemplates, expected}'
          }
          # Those of one file, or of every group file at a revision, as one list sorted by case name, keys sorted.
          # The latter is what a result is compared by: a case moved to another file, or a file renamed, changes
          # no result, so it is not a change.
          sorted() {
            jq -s -S -c 'sort_by(.name)'
          }
          cases_at() {
            git ls-tree -r --name-only "$1" -- "$dir" | while IFS= read -r file; do
              case "$file" in
                "$dir/clock-cases.json" | "$dir/tool-list.json") continue ;;
              esac
              file_cases "$1" "$file"
            done | sorted
          }
          tools_at() {
            git show "$1:$dir/tool-list.json" 2> /dev/null | jq -S -c . || echo "unreadable at $1"
          }
          changed=""
          if [ "$(cases_at "$base")" != "$(cases_at HEAD)" ]; then
            # Name the files whose own goldens changed
            while IFS= read -r file; do
              case "$file" in
                "$dir/clock-cases.json" | "$dir/tool-list.json" | "") continue ;;
              esac
              if [ "$(file_cases "$base" "$file" | sorted)" != "$(file_cases HEAD "$file" | sorted)" ]; then
                changed="${changed}${file}"$'\n'
              fi
            done <<< "$(git diff --name-only --no-renames "$base" HEAD -- "$dir")"
          fi
          if [ "$(tools_at "$base")" != "$(tools_at HEAD)" ]; then
            changed="${changed}${dir}/tool-list.json"$'\n'
          fi
          if [ -z "$changed" ]; then
            echo "No golden result changed."
            exit 0
          fi
          if printf '%s' "$PR_LABELS" | jq -e 'index("golden-change")' > /dev/null; then
            echo "The golden-change label is on this PR; the maintainer's recorded OK covers these changes:"
            printf '%s' "$changed"
            exit 0
          fi
          files="$(printf '%s' "$changed" | tr '\n' ' ')"
          echo "::error::This PR changes the golden results, which are the tool contract: ${files}"
          printf '%s' "$changed"
          echo "::error::They change only with the maintainer's explicit OK, recorded on the PR. Once it is, the maintainer adds the golden-change label."
          exit 1

  build-and-test:
    name: Cargo build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installs the toolchain rust/rust-toolchain.toml names (rust-src-dir points it there), so
      # CI and local builds use the same compiler, and caches through Swatinem/rust-cache (which
      # the action pins by SHA itself). Its key covers the rustc version, Cargo.lock and the job,
      # and it caches only the dependencies' build output, not this crate's, so a cache never
      # holds a stale build of our code or another toolchain's.
      # Warnings don't fail the build during the spike: build-warnings is v2's switch for that
      # (it defaults to deny), and rustflags is left empty.
      - name: Set up the Rust toolchain and cache
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          rust-src-dir: rust
          cache-workspaces: rust
          rustflags: ""
          build-warnings: warn

      # The action falls back to stable if it misses the toolchain file; fail loudly instead.
      - name: Check the compiler is the pinned one
        run: |
          expected="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          rustc --version | grep -q "^rustc ${expected} " || { rustc --version; echo "expected rustc ${expected}" >&2; exit 1; }

      - name: Build (debug)
        run: cargo build --locked

      # Includes the parity cases (#371): rust/tests/parity.rs holds the binary to the recorded results, calls and
      # tools/list from rust/tests/data/parity (the one source of the cases and their goldens, #379), and
      # parity_self_check.rs proves it can fail. cargo-mutants runs this same command per mutant (ADR-0033), so a
      # parity case kills a mutant it notices.
      #
      # The golden-result comparison (#124) is this cargo test (#371, #375): rust/tests/parity.rs holds the binary
      # just built to the results recorded from the TypeScript server before it was retired (rust/tests/data/parity):
      # each tool result (JSON by deep equality and minified), prompt and resource, the LogSeq calls and `tools/list`
      # by meaning (ADR-0031), the closest names of a missing page by the rules of ADR-0032, and parity_self_check.rs
      # shows it fails on every perturbed case. It starts its own stub LogSeq on a random local port, so nothing here
      # contacts a LogSeq. parity_comparator.rs and parity_harness.rs hold the comparator and the harness to their own
      # rules, and parity_record.rs holds the recorder (which refuses to run here: `CI` is set). Nothing in Node
      # compares a result any more.
      - name: Unit tests
        run: cargo test --locked

      # Node is for the guard tests that start the binary, and for nothing else here.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install the guard tests' dependencies
        working-directory: .
        run: npm ci

      # The guards that start the binary just built: the live tools/list, the arguments it refuses, its version.
      - name: Guard tests that start the server
        working-directory: .
        run: npx vitest run tests/rust-guards

      # The slowest step (thin LTO, one codegen unit). Only the parity test below uses its output:
      # the startup and footprint measurements (#126) build the release binary locally. It runs on
      # a push to main and by hand. Until then the release profile is checked locally:
      # `cd rust && cargo build --release --locked`.
      - name: Build (release)
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: cargo build --release --locked

      # The parity cases through cargo test against the release profile (#371): the same comparator as the debug run,
      # on the optimised build (thin LTO, one codegen unit, stripped), which proves it answers the same. A release
      # build ignores LOGSEQ_MCP_NOW (rust/src/env.rs), so the cases that read today's date leave this run
      # (parity_support/cases.rs, clock-cases.json); the debug run above still holds the server to every one.
      - name: Parity test (release build)
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: cargo test --release --locked --test parity --test parity_self_check

      # The library's unit tests with debug_assertions off (#359): the ones that exist only in a release
      # build, such as the one holding that it ignores LOGSEQ_MCP_NOW (`#[cfg(not(debug_assertions))]` in
      # rust/src/env.rs), and the date logic as the shipped profile compiles it. Nothing runs these in a pull
      # request, so they run with the release build. `--lib` skips the integration tests, which spawn the
      # binary and are covered by the debug run and the parity test. Turning LTO off and using 16 codegen
      # units keeps this to a few minutes: the full release profile (thin LTO, one codegen unit) is what makes
      # the build above slow, and neither setting changes what debug_assertions does. It rebuilds the
      # dependencies once, since the profile differs from the one the release build used.
      - name: Unit tests (release)
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        env:
          CARGO_PROFILE_RELEASE_LTO: 'off'
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
        run: cargo test --release --locked --lib
