name: Mutation testing (full run)

# The `ref` input goes in the run's title, because a run started with a SHA in "ref" has the branch
# it was started from as its head_sha. The PR mutation job (scripts/mutation-ratchet.ts) matches that
# title against the PR's head commit to find a successful run for it (ADR-0028).
run-name: Full mutation run ${{ inputs.ref }}

# A full cold mutation run of the unit suite (ADR-0026, #204, #205), weekly and on demand. It never
# blocks a PR and it is the only job besides a push to main that saves Stryker's incremental
# file, which resets any drift in the cache the PR job restores. It fails when any file is below
# its score in mutation-baseline.json (scripts/mutation-ratchet.ts), which is the backstop for what
# the PR job's cache can't see. A failing check still saves the cache and uploads the report.
#
# By hand (Actions tab, "Run workflow") it runs against any commit: put the full SHA in "ref". The
# baseline work needs three runs on one main SHA, so a repeat run on the same ref is fine
# (its cache save then finds the key taken and skips). A run never restores a cache, so each
# one starts cold.
#
# It saves the incremental file only when the commit is on main. A cache saved from a commit
# that never merged would be the newest one every PR restores. An off-main run still reports.
on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
    inputs:
      ref:
        description: Commit SHA, branch or tag to run on. Empty means the branch the run is started from.
        type: string
        default: ''

permissions:
  contents: read

jobs:
  full:
    name: Full mutation run
    runs-on: ubuntu-latest
    # A cold run of the whole scope took about 30 to 40 minutes locally (ADR-0026).
    timeout-minutes: 120
    steps:
      # Full history, to tell whether the commit is on main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Resolve the commit
        id: commit
        run: |
          SHA="$(git rev-parse HEAD)"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          if git merge-base --is-ancestor "$SHA" origin/main; then
            echo "on_main=true" >> "$GITHUB_OUTPUT"
          else
            echo "on_main=false" >> "$GITHUB_OUTPUT"
          fi

      # No incremental file exists in a fresh checkout, so Stryker mutates the whole scope.
      - name: Full cold run
        id: stryker
        run: npx stryker run

      # No plan.json here, so the check expects a row for every baseline entry. No base: a scheduled
      # run has no PR to compare with. It runs before the summary and the saves and fails after them.
      - name: Ratchet
        id: ratchet
        continue-on-error: true
        run: node scripts/mutation-ratchet.ts check --max-reruns 10 --rerun-budget-seconds 3600

      - name: Job summary
        if: always()
        env:
          SHA: ${{ steps.commit.outputs.sha }}
          ON_MAIN: ${{ steps.commit.outputs.on_main }}
        run: |
          echo "Commit \`$SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          if [ "$ON_MAIN" != "true" ]; then
            echo "This commit is not on main, so the incremental file was not saved." >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
          fi
          node scripts/mutation-ci.ts summary >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-report-${{ steps.commit.outputs.sha }}
          path: reports/mutation/mutation.json
          if-no-files-found: ignore
          retention-days: 90

      - name: Save the incremental file
        if: always() && steps.stryker.outcome == 'success' && steps.commit.outputs.on_main == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reports/mutation/stryker-incremental.json
          key: mutation-incremental-${{ steps.commit.outputs.sha }}

      # Last, so the report, the summary and the cache are saved first.
      - name: Fail when a file is below its baseline
        if: steps.ratchet.outcome == 'failure'
        run: |
          echo "The ratchet failed. See the Mutation ratchet section of the job summary." >&2
          exit 1
