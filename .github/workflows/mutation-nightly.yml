name: Mutation testing (nightly cache check)

# Resets a stale incremental cache with at most one weekly run a night (#279, ADR-0030). After a
# blind-spot change lands on main, every push takes the cache-miss path and can't save the cache,
# so every PR plans against an old one until a weekly run on main saves a new one (ADR-0029).
#
# The check reads the newest saved mutation-incremental-* cache on main and main's commits since,
# and asks `node scripts/mutation-ci.ts nightly` (nightlyDecision) whether to dispatch
# mutation-weekly.yml on main. It dispatches only when one of those commits changed a blind-spot
# input (or no cache is saved), and never while a weekly run on main is in flight or started in the
# last 20 hours. Most nights the cache is current and nothing runs.
#
# It runs after the Monday weekly run's start (03:17), so on Mondays that run holds it back. By hand
# (Actions tab, "Run workflow") it makes the same check, with the same guard.
on:
  schedule:
    - cron: '47 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

# Two checks at once could both see no run in flight and both dispatch.
concurrency:
  group: mutation-nightly
  cancel-in-progress: false

jobs:
  check:
    name: Is the cache stale?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      dispatch: ${{ steps.decide.outputs.dispatch }}
    steps:
      # Main's full history, to walk its commits since the cache's commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      # scripts/mutation-ci.ts imports node: modules only, so no npm ci.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Decide
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/caches?key=mutation-incremental-&ref=refs/heads/main&sort=created_at&direction=desc&per_page=100" > "$RUNNER_TEMP/caches.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/mutation-weekly.yml/runs?branch=main&per_page=30" > "$RUNNER_TEMP/runs.json"
          node scripts/mutation-ci.ts nightly --caches "$RUNNER_TEMP/caches.json" --runs "$RUNNER_TEMP/runs.json" > "$RUNNER_TEMP/decision.txt"
          cat "$RUNNER_TEMP/decision.txt"
          cat "$RUNNER_TEMP/decision.txt" >> "$GITHUB_OUTPUT"

      - name: Job summary
        env:
          DISPATCH: ${{ steps.decide.outputs.dispatch }}
          REASON: ${{ steps.decide.outputs.reason }}
        run: |
          echo "## Nightly mutation cache check" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo "Dispatch a weekly run on main: $DISPATCH. $REASON." >> "$GITHUB_STEP_SUMMARY"

  # The only job that can write: it starts the weekly run on main, and does nothing else.
  dispatch:
    name: Dispatch the weekly run on main
    needs: check
    if: needs.check.outputs.dispatch == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Dispatch mutation-weekly.yml
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run mutation-weekly.yml --repo "$GITHUB_REPOSITORY" --ref main
