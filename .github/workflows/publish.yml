name: Publish to npm

# Manual only: this workflow never runs on push or on a pull request. The
# maintainer starts it from the Actions tab ("Run workflow") on main.
#
# Before the first real run, add an npm automation or granular access token as the
# repository secret NPM_TOKEN (Settings > Secrets and variables > Actions). Until
# then, leave "dry_run" ticked: it runs every check and `npm publish --dry-run`,
# and needs no secret.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Check and pack only; run npm publish --dry-run instead of publishing
        type: boolean
        default: true

permissions:
  contents: read
  # Lets npm sign a provenance statement for the package with the workflow's OIDC identity
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: Check and publish
    # Publish only what is on main, so the tarball matches reviewed code
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      # Unit tests only. The integration tests read a personal LogSeq graph that CI can't reach.
      - name: Unit tests
        run: npx vitest run src

      # prepublishOnly builds again; this step makes a build failure show up on its own line.
      - name: Build
        run: npm run build

      - name: Show tarball contents
        run: npm pack --dry-run

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            npm publish --provenance --access public --dry-run
          else
            if [ -z "$NODE_AUTH_TOKEN" ]; then
              echo "::error::The NPM_TOKEN repository secret is not set. Add it, or re-run with dry_run ticked."
              exit 1
            fi
            npm publish --provenance --access public
          fi
