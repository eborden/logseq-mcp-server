name: Rust spike

# The Rust implementation beside the TypeScript one (ADR-0025, #122). Kept apart from ci.yml so
# the TypeScript jobs and the guards that read ci.yml (src/adr-workflow-guards.test.ts) stay as
# they are. It builds and tests only; it never publishes (ADR-0017 covers npm, and a binary
# release needs its own ADR first).
on:
  pull_request:
    paths:
      - 'rust/**'
      # serverInfo.version is read from package.json at build time (rust/src/server.rs).
      - 'package.json'
      # the parity harness and what it compares with
      - 'scripts/parity.ts'
      - 'scripts/parity/**'
      - 'src/__snapshots__/tool-list.test.ts.snap'
      - '.github/workflows/rust.yml'
  # pull_request has no branch filter, so it runs on PRs into feature/rust-spike as well as main.
  # GitHub offers a manual run only for a workflow file on the default branch, so this works once
  # rust.yml is on main (see the release step below).
  workflow_dispatch:
  push:
    branches: [main, feature/rust-spike]
    paths:
      - 'rust/**'
      - 'package.json'
      - 'scripts/parity.ts'
      - 'scripts/parity/**'
      - 'src/__snapshots__/tool-list.test.ts.snap'
      - '.github/workflows/rust.yml'

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Cargo build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installs the toolchain rust/rust-toolchain.toml names (rust-src-dir points it there), so
      # CI and local builds use the same compiler, and caches through Swatinem/rust-cache (which
      # the action pins by SHA itself). Its key covers the rustc version, Cargo.lock and the job,
      # and it caches only the dependencies' build output, not this crate's, so a cache never
      # holds a stale build of our code or another toolchain's.
      # Warnings don't fail the build during the spike: build-warnings is v2's switch for that
      # (it defaults to deny), and rustflags is left empty.
      - name: Set up the Rust toolchain and cache
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          rust-src-dir: rust
          cache-workspaces: rust
          rustflags: ""
          build-warnings: warn

      # The action falls back to stable if it misses the toolchain file; fail loudly instead.
      - name: Check the compiler is the pinned one
        run: |
          expected="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          rustc --version | grep -q "^rustc ${expected} " || { rustc --version; echo "expected rustc ${expected}" >&2; exit 1; }

      - name: Build (debug)
        run: cargo build --locked

      - name: Unit tests
        run: cargo test --locked

      # The parity harness (#124) holds the binary just built to the TypeScript server: each tool
      # result byte for byte, the LogSeq calls and `tools/list` by meaning (ADR-0031). It starts its
      # own stub LogSeq on a random local port, so nothing here contacts a LogSeq. The flag is for
      # the spike's one tool: it compares `tools/list` for the tools the cases call, and the server
      # must list those and no others.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install the harness's dependencies
        working-directory: .
        run: npm ci

      - name: Parity with the TypeScript server
        working-directory: .
        run: node node_modules/vite-node/vite-node.mjs scripts/parity.ts --tested-tools-only "$PWD/rust/target/debug/logseq-mcp-server"

      # The slowest step (thin LTO, one codegen unit), and nothing in CI uses its output: the
      # startup and footprint measurements (#126) build the release binary locally. It runs on a
      # push to main and by hand, but both only work once this file is on main. Until then the
      # release profile is checked locally: `cd rust && cargo build --release --locked`.
      - name: Build (release)
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: cargo build --release --locked

  # TEMPORARY (#126): one run on a pull request, to time a release build per platform. It is removed
  # in the same PR once the numbers are recorded. It builds and prints sizes; nothing is uploaded or
  # published (ADR-0017).
  release-cost:
    name: Release build (${{ matrix.target }})
    if: github.event_name == 'pull_request'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: darwin-arm64, os: macos-latest }
          - { target: darwin-x64, os: macos-15-intel }
          - { target: linux-x64, os: ubuntu-latest }
          - { target: windows-x64, os: windows-latest }
    defaults:
      run:
        working-directory: rust
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up the Rust toolchain and cache
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          rust-src-dir: rust
          cache-workspaces: rust
          rustflags: ""
          build-warnings: warn
      - name: Release build, cold (no dependency cache on the first run)
        run: |
          start=$SECONDS
          cargo build --release --locked
          echo "RELEASE_COLD_SECONDS=$((SECONDS - start))" >> "$GITHUB_ENV"
      - name: Release build, this crate only (dependencies already built)
        run: |
          touch src/main.rs src/lib.rs
          start=$SECONDS
          cargo build --release --locked
          echo "RELEASE_CRATE_SECONDS=$((SECONDS - start))" >> "$GITHUB_ENV"
      - name: Report
        run: |
          bin="$(ls target/release/logseq-mcp-server target/release/logseq-mcp-server.exe 2>/dev/null | head -1)"
          echo "target=${{ matrix.target }} runner=${{ matrix.os }} cold_build_s=$RELEASE_COLD_SECONDS crate_only_build_s=$RELEASE_CRATE_SECONDS binary_bytes=$(wc -c < "$bin")" | tee -a "$GITHUB_STEP_SUMMARY"
