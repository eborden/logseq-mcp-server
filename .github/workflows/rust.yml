name: Rust spike

# The Rust implementation beside the TypeScript one (ADR-0025, #122). Kept apart from ci.yml so
# the TypeScript jobs and the guards that read ci.yml (src/adr-workflow-guards.test.ts) stay as
# they are. It builds and tests only; it never publishes (ADR-0017 covers npm, and a binary
# release needs its own ADR first).
on:
  pull_request:
    paths:
      - 'rust/**'
      # serverInfo.version is read from package.json at build time (rust/src/server.rs).
      - 'package.json'
      # the parity harness and what it compares with
      - 'scripts/parity.ts'
      - 'scripts/parity/**'
      - 'src/__snapshots__/tool-list.test.ts.snap'
      - '.github/workflows/rust.yml'
  # pull_request has no branch filter, so it runs on PRs into feature/rust-spike as well as main.
  # GitHub offers a manual run only for a workflow file on the default branch, so this works once
  # rust.yml is on main (see the release step below).
  workflow_dispatch:
  push:
    branches: [main, feature/rust-spike]
    paths:
      - 'rust/**'
      - 'package.json'
      - 'scripts/parity.ts'
      - 'scripts/parity/**'
      - 'src/__snapshots__/tool-list.test.ts.snap'
      - '.github/workflows/rust.yml'

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Cargo build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installs the toolchain rust/rust-toolchain.toml names (rust-src-dir points it there), so
      # CI and local builds use the same compiler, and caches through Swatinem/rust-cache (which
      # the action pins by SHA itself). Its key covers the rustc version, Cargo.lock and the job,
      # and it caches only the dependencies' build output, not this crate's, so a cache never
      # holds a stale build of our code or another toolchain's.
      # Warnings don't fail the build during the spike: build-warnings is v2's switch for that
      # (it defaults to deny), and rustflags is left empty.
      - name: Set up the Rust toolchain and cache
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          rust-src-dir: rust
          cache-workspaces: rust
          rustflags: ""
          build-warnings: warn

      # The action falls back to stable if it misses the toolchain file; fail loudly instead.
      - name: Check the compiler is the pinned one
        run: |
          expected="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          rustc --version | grep -q "^rustc ${expected} " || { rustc --version; echo "expected rustc ${expected}" >&2; exit 1; }

      - name: Build (debug)
        run: cargo build --locked

      - name: Unit tests
        run: cargo test --locked

      # The parity harness (#124) holds the binary just built to the TypeScript server: each tool
      # result, prompt and resource byte for byte, the LogSeq calls and `tools/list` by meaning
      # (ADR-0031). The server lists all 16 tools, so the whole `tools/list` is compared (#316). It
      # starts its own stub LogSeq on a random local port, so nothing here contacts a LogSeq.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install the harness's dependencies
        working-directory: .
        run: npm ci

      - name: Parity with the TypeScript server
        working-directory: .
        run: node node_modules/vite-node/vite-node.mjs scripts/parity.ts "$PWD/rust/target/debug/logseq-mcp-server"

      # The slowest step (thin LTO, one codegen unit). Only the parity step below uses its output:
      # the startup and footprint measurements (#126) build the release binary locally. It runs on
      # a push to main and by hand, but both only work once this file is on main. Until then the
      # release profile is checked locally: `cd rust && cargo build --release --locked`.
      - name: Build (release)
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: cargo build --release --locked

      # The unit tests as compiled for the release profile (#359): the ones that exist only there, such as
      # the release build ignoring LOGSEQ_MCP_NOW (`#[cfg(not(debug_assertions))]` in rust/src/env.rs), and
      # the date logic as the shipped binary has it. Nothing runs these in a pull request, so they run with
      # the release build.
      - name: Unit tests (release)
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: cargo test --release --locked

      # The same harness against the release binary (#359): the debug build above proves the logic,
      # this proves the optimised build (thin LTO, one codegen unit, stripped) answers the same. It
      # needs the release build, so it runs under the same condition. A release build ignores
      # LOGSEQ_MCP_NOW (rust/src/env.rs), so --real-clock leaves out the cases that read today's date
      # (scripts/parity/clock-cases.ts); the debug run above still holds the server to every one.
      - name: Parity with the TypeScript server (release binary)
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        working-directory: .
        run: node node_modules/vite-node/vite-node.mjs scripts/parity.ts --real-clock "$PWD/rust/target/release/logseq-mcp-server"
