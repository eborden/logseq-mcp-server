# cargo-mutants 27.1.0 for the server crate (ADR-0033, #364). The tool runs in CI only (.github/workflows/rust-mutation.yml
# and rust-mutation-full.yml). Nobody runs it on a developer machine, agents included: `cargo mutants --list` is the one local
# use, because it parses the source and builds nothing.
#
# Scope. Every file under src/ that has mutants is examined, with no exclusions to start, so `examine_globs` and
# `exclude_globs` stay unset. Setting either, or `examine_re`, narrows what the ratchet measures, so once the baseline
# exists (rust/mutation-baseline.json) a change to them needs the `mutation-baseline-change` label and the maintainer's OK.
# The tool matches a mutant name, never a test, so `rust/tests/` and every `#[cfg(test)]` item are out of scope by its own rules.
#
# Skipped tests. `additional_cargo_test_args` stays unset: a mutant runs exactly what `cargo test --locked` runs, parity cases
# included (#371). A test is skipped only if a CI measurement shows it costs time or flakes (ADR-0033 "Tool and scope"), each one
# named here with its reason and the label above. The PR 1 measurements of #364 say whether any is worth it.
#
# Every cargo call the tool makes gets --locked, as CI's own build and test do, so a run can never change Cargo.lock.
additional_cargo_args = ["--locked"]

# copy_target stays at its default (false): the tool then doesn't copy the restored target/ into its scratch copies of the tree.
# Measured in CI for #364 PR 1, on a one-in-100 sample of the mutants with the dependency cache restored: copying it cut the
# baseline build from 51 s to 47 s and the run from 425 s to 420 s, so it isn't worth the copy and the disk (one target/ per job).

# Ignores. An entry here removes the mutants whose name it matches, from the run and from the score. It is matched against the
# name `cargo mutants --list` prints, which includes the file, the line and the column, so a pattern must name the function and
# the replacement and never a line or a column (`src/x.rs: replace f -> bool with true` style, not `x.rs:12:5`): an edit above
# it would otherwise stale it. Each entry is preceded by a `# reason:` comment and the PR that adds it raises the file's `ignores`
# in rust/mutation-baseline.json. None yet.
exclude_re = []
