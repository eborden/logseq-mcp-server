[package]
name = "logseq-mcp-server"
# The server's version: serverInfo.version is this (src/server.rs). tests/rust-guards/version.test.ts keeps
# it equal to package.json and the plugin manifest.
version = "1.0.0"
edition = "2024"
# rmcp 3.x needs 1.88. rust-toolchain.toml pins the same version for local builds and CI.
rust-version = "1.88"
publish = false
description = "Spike: the LogSeq MCP server in Rust, beside the TypeScript one (ADR-0025, #122)"

[dependencies]
# The official MCP SDK. No macros (the tools are listed by hand, see src/server.rs) and only
# the stdio transport.
rmcp = { version = "3.5.1", default-features = false, features = ["server", "transport-io"] }
# The async runtime rmcp is built on. Current-thread only: one stdio client at a time.
tokio = { version = "1.47", default-features = false, features = ["rt", "macros"] }
# HTTP to LogSeq's API. No TLS (the API is plain HTTP on localhost) and no default features.
reqwest = { version = "0.12", default-features = false, features = ["json"] }
# JSON in and out. Already in rmcp's tree. preserve_order keeps object keys in insertion order,
# as JSON.stringify does: without it serde_json sorts them, and the byte-for-byte parity of
# ADR-0025 Decision 2 would fail on key order alone.
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
# Tool input schemas, generated from the same type serde parses the arguments into. Already in
# rmcp's tree (rmcp's `server` feature turns it on).
schemars = "1"
# Unicode normalization (NFD), for the closest page names' fold (`src/fuzzy.rs`: NFD, drop the marks,
# lowercase, as the parity harness folds them). Already in the tree, through reqwest > url > idna >
# idna_adapter, with these same features and locked version, so it adds no build and no download.
icu_normalizer = { version = "2.2", default-features = false, features = ["compiled_data"] }
# General categories: letter and number for `query_by_date_range`'s whole-word test (`\p{L}`, `\p{N}`),
# and mark for the fold above. Already in the tree, under idna_adapter, with the same features and version.
icu_properties = { version = "2.2", default-features = false, features = ["compiled_data"] }
# `localeCompare`'s order across scripts, which only the full collation tables give (Latin before Greek
# before Cyrillic, `ß` as `ss`, ...). Same ICU4X release line as icu_properties (unicode-org/icu4x, Unicode-3.0
# license, actively released: 2.3.1 as of Oct 2026) and built on the icu_properties and
# icu_provider already locked, so the new builds are icu_collator and its data crate. Its data ships in the
# binary (the PR records the size). The data is CLDR 48 root, as in Node 24's ICU 78, except for Han: ICU4X
# orders ideographs by block (code point) and Node by radical and stroke. The maintainer accepted that
# difference (#299, `js::locale_compare`).
icu_collator = { version = "2.3", default-features = false, features = ["compiled_data"] }
# The closest page names for a missing page (`src/fuzzy.rs`, ADR-0032): a maintained fuzzy matcher
# (helix-editor/nucleo, MPL-2.0, accepted next to this repo's MIT licence by the maintainer on 2026-10-08)
# in place of a port of fuzzysort. 0.3.1 doesn't compile with these two features off (`CaseMatching` and
# `Normalization` derive `Default` for a variant they gate), so they are on, and the code never uses
# them: its `unicode-normalization` table is wrong for Latin Extended Additional (`ạ` becomes `o`), so
# the fold is done here (NFD, icu_normalizer) and `Normalization::Never` and `CaseMatching::Respect`
# keep nucleo's own tables out of every match. It adds itself and `memchr`, which is already locked.
# `unicode-segmentation` stays off.
nucleo-matcher = { version = "0.3.1", default-features = false, features = ["unicode-normalization", "unicode-casefold"] }

# The local calendar day (`localtime_r`), which `new Date()`'s local components give the TypeScript
# server and no standard library function does. Already in the tree (tokio, mio and socket2 use it),
# at the locked version, so it adds no build and no download. Unix only: elsewhere the date is UTC.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { version = "1.47", default-features = false, features = ["rt", "macros", "net", "io-util", "time"] }

[profile.dev]
# Backtraces keep file and line, and the build and its cache shrink (#302). Full debug info is
# only needed under a debugger.
debug = "line-tables-only"

[profile.release]
# Startup time and footprint are what the spike measures (#126).
lto = "thin"
codegen-units = 1
strip = "symbols"
